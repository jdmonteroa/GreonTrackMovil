# Dependabot: revision de dependencias (SCA).
#
# open-pull-requests-limit: 0 apaga las actualizaciones "de version" (las que
# abrian un pull request por cada libreria nueva), para que nadie haga merge
# por error de una version que rompe la app. Las alertas y actualizaciones de
# SEGURIDAD no dependen de este limite: siguen funcionando si estan activadas
# en Settings > Advanced Security > Dependabot.
#
# Para volver a recibir pull requests de versiones nuevas, cambia el 0 por 5.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
    # Agrupa las librerias relacionadas para que lleguen menos pull requests
    groups:
      androidx-y-compose:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      supabase-y-ktor:
        patterns:
          - "io.github.jan-tennert.supabase*"
          - "io.ktor*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
